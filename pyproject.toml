[project]
name = "stealerlogs"
version = "0.1.0"
description = "Official Python library for the stealerlogs.com API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "stealerlogs" }]
keywords = ["stealerlogs", "api", "osint", "client"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.10",
]

[project.urls]
Homepage = "https://stealerlogs.com"
Repository = "https://github.com/stealerlogs-com/stealerlogs-py"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
